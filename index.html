<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ponpes Mathlabul Hidayah Nursalam</title>
    
    <!-- PWA Linkages & Metadata -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    
    <meta name="theme-color" content="#15803d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MH Nursalam" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-slate-100 antialiased select-none">
    <!-- Midtrans Snap.js dimuat dinamis via Vite env -->
    <script type="module">
      // VITE_MIDTRANS_CLIENT_KEY wajib diset di .env
      const clientKey = import.meta.env.VITE_MIDTRANS_CLIENT_KEY || '';
      const isProduction = import.meta.env.VITE_MIDTRANS_IS_PRODUCTION === 'true';
      const snapHost = isProduction
        ? 'https://app.midtrans.com'
        : 'https://app.sandbox.midtrans.com';
      if (clientKey) {
        const script = document.createElement('script');
        script.src = `${snapHost}/snap/snap.js`;
        script.setAttribute('data-client-key', clientKey);
        document.head.appendChild(script);
      } else {
        console.warn('[Midtrans] VITE_MIDTRANS_CLIENT_KEY tidak dikonfigurasi. Snap.js tidak dimuat.');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => {
              console.log("PWA Service Worker registered successfully:", reg.scope);
            })
            .catch((err) => {
              console.warn("PWA Service Worker registration failed:", err);
            });
        });
      }
    </script>
  </body>
</html>
