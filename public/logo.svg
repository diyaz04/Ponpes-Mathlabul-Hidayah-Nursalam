<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Circle Background for PWA Maskable requirement -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Elegant Islamic Star Polygon Border (8-Pointed Star / Rub el Hizb) -->
  <g transform="translate(256, 256) scale(1.15)">
    <path d="M-140,0 L-99,-99 L0,-140 L99,-99 L140,0 L99,99 L0,140 L-99,99 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
    <path d="M-99,-99 L0,-140 L99,-99 L140,0 L99,99 L0,140 L-99,99 L-140,0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" transform="rotate(45)" opacity="0.4" />
  </g>

  <!-- Elegant Circular Border with Dot Details -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" />

  <!-- The Mosque Dome Silhoutte & Crescent Moon -->
  <g transform="translate(166, 120)">
    <!-- Crescent Moon & Star -->
    <path d="M96,-30 C106,-30 115,-25 120,-18 C112,-18 104,-22 96,-22 C84,-22 75,-12 75,0 C75,12 84,22 96,22 C104,22 112,18 120,18 C115,25 106,30 96,30 C78,30 63,16 63,0 C63,-16 78,-30 96,-30 Z" fill="url(#goldGrad)" />
    <polygon points="96,-6 99,-11 104,-11 100,-15 102,-20 96,-17 90,-20 92,-15 88,-11 93,-11" fill="url(#goldGrad)" />

    <!-- Minaret Spire base -->
    <path d="M90,-10 L90,10 L84,10 L85,0 L85,-10 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Dome Roof -->
    <path d="M20,100 C20,50 60,35 90,32 C120,35 160,50 160,100 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Pillars / Arches in dome -->
    <path d="M35,100 L35,80 C35,75 42,72 45,75 L45,100 M65,100 L65,75 C65,70 72,67 75,70 L75,100 M95,100 L95,72 C95,67 102,64 105,67 L105,100 M125,100 L125,75 C125,70 132,67 135,70 L135,100 M145,100 L145,80 C145,75 152,72 155,75 L155,100" fill="#14532d" opacity="0.6"/>
  </g>

  <!-- Open Quran / Holy Book at the base -->
  <g transform="translate(141, 280)">
    <!-- Book Stands / Rehal (X shaped base) -->
    <path d="M40,90 L190,40 L190,50 L40,100 Z" fill="#ca8a04" />
    <path d="M190,90 L40,40 L40,50 L190,100 Z" fill="#854d0e" />

    <!-- Open Book Pages (Left and Right spread) -->
    <!-- Left Page -->
    <path d="M40,40 C75,25 110,40 115,42 L115,77 C110,75 75,60 40,75 Z" fill="#fcfbf7" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Right Page -->
    <path d="M190,40 C155,25 120,40 115,42 L115,77 C120,75 155,60 190,75 Z" fill="#fcfbf7" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Elegant Quranic text lines (abstracted styling) -->
    <path d="M50,48 Q70,42 90,48 M50,56 Q75,51 100,56 M50,64 Q70,59 90,64" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <path d="M180,48 Q160,42 140,48 M180,56 Q155,51 130,56 M180,64 Q160,59 140,64" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- Center Spine crease -->
    <line x1="115" y1="42" x2="115" y2="77" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Typography: M H - Nourishing Islamic Academics -->
  <text x="256" y="440" font-family="'Inter', 'Outfit', sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">MATHLABUL HIDAYAH</text>
  <text x="256" y="465" font-family="'Fira Code', 'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#fef08a" text-anchor="middle" letter-spacing="6" opacity="0.9">NURSALAM PESANTREN</text>
</svg>
